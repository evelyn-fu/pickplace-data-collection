directives:
- add_model:
    name: iiwa
    file: package://drake/manipulation/models/iiwa_description/iiwa7/iiwa7_no_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [-1.57]
        iiwa_joint_2: [0.4]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.7]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.0]
        iiwa_joint_7: [0]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
- add_model:
    name: wsg
    file: package://manipulation/hydro/schunk_wsg_50_with_tip.sdf
- add_weld:
    parent: iiwa::iiwa_link_7
    child: wsg::body
    X_PC:
        translation: [0, 0, 0.09]
        rotation: !Rpy { deg: [90, 0, 90]}
        
- add_model:
    name: mustard_bottle
    file: package://drake/manipulation/models/ycb/sdf/006_mustard_bottle.sdf
    default_free_body_pose:
        base_link_mustard:
            translation: [0, -0.6, 0.1]
            rotation: !Rpy { deg: [-90, 0, 0] }
- add_frame:
    name: table_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0 ]}
        translation: [0, 0, 0]

- add_model:
    name: table
    file: package://drake/examples/manipulation_station/models/table_wide.sdf

- add_weld:
    parent: table_origin
    child: table::table_body

- add_model:
    name: camera_main
    file: package://manipulation/camera_box.sdf
- add_weld:
    parent: world
    child: camera_main::base
    X_PC:
        translation: [0, -1.2, 0.5]
        rotation: !Rpy { deg: [-110, 0, 0] }

- add_model:
    name: camera_1
    file: package://manipulation/camera_box.sdf
- add_weld:
    parent: world
    child: camera_1::base
    X_PC:
        translation: [0.5, 0.0, 0.2]
        rotation: !Rpy { deg: [-100, 0, 135] }

- add_model:
    name: camera_2
    file: package://manipulation/camera_box.sdf
- add_weld:
    parent: world
    child: camera_2::base
    X_PC:
        translation: [-0.5, 0.0, 0.2]
        rotation: !Rpy { deg: [-100, 0, -135] }

cameras:
    main_camera:
        name: camera0
        depth: True
        X_PB:
            base_frame: camera_main::base
    camera_1:
        name: camera1
        depth: True
        X_PB:
            base_frame: camera_1::base
    camera_2:
        name: camera2
        depth: True
        X_PB:
            base_frame: camera_2::base
    
model_drivers:
    iiwa: !IiwaDriver
      hand_model_name: wsg
    wsg: !SchunkWsgDriver {}