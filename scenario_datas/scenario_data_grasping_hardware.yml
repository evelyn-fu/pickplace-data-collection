directives:
- add_model:
    name: iiwa
    file: package://drake_models/iiwa_description/sdf/iiwa7_no_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [0.0]
        iiwa_joint_2: [0.4]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.0]
        iiwa_joint_7: [-1.57]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
- add_model:
    name: wsg
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/schunk_wsg_50_long_grippers_w_buffer.sdf
- add_weld:
    parent: iiwa::iiwa_link_7
    child: wsg::body
    X_PC:
        translation: [0, 0, 0.09]
        rotation: !Rpy { deg: [90, 0, 90]}

- add_frame:
    name: table_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 90.0 ]}
        translation: [0, 0, 0]

- add_model:
    name: table
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/table_wide.sdf

- add_weld:
    parent: table_origin
    child: table::table_body

- add_frame:
    name: box_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0]}
        translation: [0.4, 0.0, 0]

- add_model:
    name: box
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/box.sdf

- add_weld:
    parent: box_origin
    child: box::box_body

- add_frame:
    name: camera0_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 0.0]}

- add_frame:
    name: handeye_camera_origin
    X_PF:
        base_frame: iiwa::iiwa_link_7
        rotation: !Rpy { deg: [1.92088771, -0.36094999, -89.40886295]}
        translation: [-0.074597, 0.0324164, 0.155892]

- add_frame:
    name: camera0_origin
    X_PF:
        base_frame: camera0_staging
        rotation: !Rpy { deg: [-110, 0, 90]}
        translation: [1.2, 0.0, 0.54]

- add_model:
    name: camera_main
    file: package://manipulation/camera_box.sdf

- add_weld:
    parent: camera0_origin
    child: camera_main::base

cameras:
    main_camera:
        name: camera0
        depth: True
        # show_rgb: True
        # D415 & D435 RGB sensor
        width: 1920
        height: 1080
        focal: !FovDegrees {x: 69, y: 42}
        # # Femto Bolt
        # width: 3840
        # height: 2160
        # focal: !FovDegrees {x: 80, y: 51}
        lcm_bus: driver_traffic
        X_PB:
            base_frame: camera_main::base
    handeye_camera:
        name: handeye_camera
        depth: True
        lcm_bus: driver_traffic
        X_PB:
            base_frame: handeye_camera_origin

camera_ids:
    main_camera: "DRAKE_RGBD_CAMERAS_843512061674"
    handeye_camera: "DRAKE_RGBD_CAMERAS_843512061674"

plant_config:
    time_step: 0.001
    contact_model: "hydroelastic"
    discrete_contact_approximation: "sap"

lcm_buses:
    driver_traffic:
        # Use a non-default LCM url to communicate with the robot.
        lcm_url: udpm://239.255.76.67:7667?ttl=0
        
model_drivers:
    iiwa: !IiwaDriver
      lcm_bus: driver_traffic
      hand_model_name: wsg
      control_mode: position_only
    wsg: !SchunkWsgDriver 
      lcm_bus: driver_traffic