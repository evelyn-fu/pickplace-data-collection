directives:
- add_model:
    name: iiwa
    file: package://drake/manipulation/models/iiwa_description/iiwa7/iiwa7_no_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [-1.57]
        iiwa_joint_2: [0.4]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.0]
        iiwa_joint_7: [0]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
- add_model:
    name: wsg
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/schunk_wsg_50_with_tip.sdf
- add_weld:
    parent: iiwa::iiwa_link_7
    child: wsg::body
    X_PC:
        translation: [0, 0, 0.09]
        rotation: !Rpy { deg: [90, 0, 90]}
        
- add_model:
    name: mustard_bottle
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/006_mustard_bottle.sdf
    default_free_body_pose:
        base_link_mustard:
            translation: [0, -0.5, 0.08]
            rotation: !Rpy { deg: [0, 0, 20] }
- add_frame:
    name: table_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0 ]}
        translation: [0, 0, 0]

- add_model:
    name: table
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/table_wide.sdf

- add_weld:
    parent: table_origin
    child: table::table_body

- add_frame:
    name: box_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0]}
        translation: [0, -0.5, 0]

- add_model:
    name: box
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/box.sdf

- add_weld:
    parent: box_origin
    child: box::box_body

- add_frame:
    name: camera0_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 0.0]}

- add_frame:
    name: camera1_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 135.0]}

- add_frame:
    name: camera2_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 45.0]}

- add_frame:
    name: camera0_origin
    X_PF:
        base_frame: camera0_staging
        rotation: !Rpy { deg: [-110, 0, 0]}
        translation: [0, -1.1, 0.5]

- add_model:
    name: camera_main
    file: package://manipulation/camera_box.sdf

- add_weld:
    parent: camera0_origin
    child: camera_main::base

- add_frame:
    name: camera1_origin
    X_PF:
        base_frame: camera1_staging
        rotation: !Rpy { deg: [-100.0, 0, 90.0]}
        translation: [.3, 0.3, .2]

- add_model:
    name: camera_1
    file: package://manipulation/camera_box.sdf

- add_weld:
    parent: camera1_origin
    child: camera_1::base

- add_frame:
    name: camera2_origin
    X_PF:
        base_frame: camera2_staging
        rotation: !Rpy { deg: [-100.0, 0, 90.0]}
        translation: [.3, -0.3, .2]

- add_model:
    name: camera_2
    file: package://manipulation/camera_box.sdf

- add_weld:
    parent: camera2_origin
    child: camera_2::base

cameras:
    main_camera:
        name: camera0
        depth: True
        X_PB:
            base_frame: camera_main::base
    camera_1:
        name: camera1
        depth: True
        X_PB:
            base_frame: camera_1::base
    camera_2:
        name: camera2
        depth: True
        X_PB:
            base_frame: camera_2::base

model_drivers:
    iiwa: !IiwaDriver
      hand_model_name: wsg
    wsg: !SchunkWsgDriver {}