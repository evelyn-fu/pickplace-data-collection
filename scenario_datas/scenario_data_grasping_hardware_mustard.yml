directives:
- add_model:
    name: iiwa
    file: package://drake_models/iiwa_description/sdf/iiwa7_no_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [0.0]
        iiwa_joint_2: [0.4]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.0]
        iiwa_joint_7: [-1.57]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
- add_model:
    name: wsg
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/schunk_wsg_50_large_grippers_w_buffer.sdf
- add_weld:
    parent: iiwa::iiwa_link_7
    child: wsg::body
    X_PC:
        translation: [0, 0, 0.09]
        rotation: !Rpy { deg: [90, 0, 90]}
        
- add_model:
    name: mustard_bottle
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/006_mustard_bottle.sdf
    default_free_body_pose:
        base_link_mustard:
            # translation: [0.4, 0.01, 0.15]
            translation: [0.05, 0.55, -0.03]
            rotation: !Rpy { deg: [0, 0, 110] }
- add_frame:
    name: table_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 90.0 ]}
        translation: [0, 0, -0.035]

- add_model:
    name: table
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/table_wide.sdf

- add_weld:
    parent: table_origin
    child: table::table_body

- add_frame:
    name: box_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0]}
        translation: [0.4, 0.0, -0.01]

- add_model:
    name: box
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/box.sdf

- add_weld:
    parent: box_origin
    child: box::box_body

- add_frame:
    name: camera0_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 0.0]}

- add_frame:
    name: camera1_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 0.0]}

- add_frame:
    name: camera2_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 0.0]}

- add_frame:
    name: camera_bin_staging
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0, 0, 0.0]}

- add_frame:
    name: camera0_origin
    X_PF:
        base_frame: camera0_staging
        rotation: !Rpy { deg: [-150.29508676,   -0.49652966,   87.69325379]}
        translation: [1.00847, -0.0314675, 1.12864]

- add_frame:
    name: camera1_origin
    X_PF:
        base_frame: camera1_staging
        rotation: !Rpy { deg: [-105.81290946,    2.14985993,  -43.7254432]}
        translation: [-0.110748, -0.931772,  0.388191]

- add_frame:
    name: camera2_origin
    X_PF:
        base_frame: camera2_staging
        rotation: !Rpy { deg: [-102.739428,   -3.69469624, -149.1420755]}
        translation: [-0.0533544,  1.00955,  0.449207]

- add_frame:
    name: camera_bin_origin
    X_PF:
        base_frame: camera_bin_staging
        rotation: !Rpy { deg: [-165.04723828404602, 1.3368903317932492, -87.72725370947829]}
        translation: [-0.0338161,  0.62563,    0.360087]

- add_model:
    name: camera_front
    file: package://manipulation/camera_box.sdf

- add_model:
    name: camera_right
    file: package://manipulation/camera_box.sdf

- add_model:
    name: camera_left
    file: package://manipulation/camera_box.sdf

# - add_model:
#     name: camera_bin
#     file: package://manipulation/camera_box.sdf

- add_weld:
    parent: camera0_origin
    child: camera_front::base

- add_weld:
    parent: camera1_origin
    child: camera_right::base

- add_weld:
    parent: camera2_origin
    child: camera_left::base

# - add_weld:
#     parent: camera_bin_origin
#     child: camera_bin::base

cameras:
    camera_front:
        name: camera0
        depth: True
        width: 1920
        height: 1440
        X_PB:
            base_frame: camera_front::base
    camera_right:
        name: camera1
        depth: True
        width: 1920
        height: 1440
        X_PB:
            base_frame: camera_right::base
    camera_left:
        name: camera2
        depth: True
        width: 1920
        height: 1440
        X_PB:
            base_frame: camera_left::base
    camera_bin:
        name: camera_bin
        depth: True
        width: 1920
        height: 1440
        X_PB:
            base_frame: camera_bin_origin

plant_config:
    time_step: 0.001
    contact_model: "hydroelastic"
    discrete_contact_approximation: "sap"

lcm_buses:
    driver_traffic:
        # Use a non-default LCM url to communicate with the robot.
        lcm_url: udpm://239.255.76.67:7667?ttl=0

model_drivers:
    iiwa: !IiwaDriver
      lcm_bus: driver_traffic
      hand_model_name: wsg
      control_mode: position_only
    wsg: !SchunkWsgDriver
      lcm_bus: driver_traffic