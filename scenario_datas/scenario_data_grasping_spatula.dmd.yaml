directives:
- add_model:
    name: iiwa
    file: package://drake_models/iiwa_description/sdf/iiwa7_no_collision.sdf
    default_joint_positions:
        iiwa_joint_1: [0.0]
        iiwa_joint_2: [0.4]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.0]
        iiwa_joint_7: [-1.57]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
- add_model:
    name: wsg
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/schunk_wsg_50_welded_fingers_w_buffer.sdf
- add_weld:
    parent: iiwa::iiwa_link_7
    child: wsg::body
    X_PC:
        translation: [0, 0, 0.09]
        rotation: !Rpy { deg: [90, 0, 90]}
        
- add_model:
    name: spatula
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/spatula.sdf
    default_free_body_pose:
        spatula:
            translation: [0.4, -0.05, 0.07]
            rotation: !Rpy { deg: [-25, 0, 0] }
- add_frame:
    name: spatula_origin
    X_PF:
        base_frame: world
        translation: [0.4, 0.0, 0.12]
        rotation: !Rpy { deg: [0, 0, 110] }
- add_weld:
    parent: spatula_origin
    child: spatula::spatula

- add_frame:
    name: table_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 90.0 ]}
        translation: [0, 0, 0]

- add_model:
    name: table
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/table_wide.sdf

- add_weld:
    parent: table_origin
    child: table::table_body

- add_frame:
    name: box_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0]}
        translation: [0.4, 0.0, 0]

- add_model:
    name: box
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/box.sdf

- add_weld:
    parent: box_origin
    child: box::box_body
