- add_frame:
    name: table_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 90.0 ]}
        translation: [0, 0, 0]

- add_model:
    name: table
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/table_wide.sdf

- add_weld:
    parent: table_origin
    child: table::table_body

- add_frame:
    name: box_origin
    X_PF:
        base_frame: world
        rotation: !Rpy { deg: [0.0, 0.0, 0.0]}
        translation: [0.4, 0.0, 0]

- add_model:
    name: box
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/box.sdf

- add_weld:
    parent: box_origin
    child: box::box_body

- add_model:
    name: wall
    file: file://./home/real2sim/src/Real2SimObjectManipulation/models/front_wall.sdf

- add_weld:
    parent: world
    child: wall::wall_body
