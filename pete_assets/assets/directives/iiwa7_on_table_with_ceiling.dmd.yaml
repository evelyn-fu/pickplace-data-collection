directives:

- add_model:
    name: iiwa7
    file: package://iiwa_description/urdf_output/iiwa7_box_collision_manual_edit.urdf
    # file: package://iiwa_description/urdf_output/iiwa7_box_collision.urdf
    default_joint_positions:
        iiwa_joint_1: [0.0]
        iiwa_joint_2: [0.4]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.0]
        iiwa_joint_7: [-1.57]

- add_weld:
    parent: world
    child: iiwa7::iiwa_link_0

- add_model:
    name: wsg
    file: package://wsg_description/urdf/wsg50_110_no_fingers_box_collision.urdf

- add_frame:
    name: iiwa7::wsg_attach
    X_PF:
      base_frame: iiwa7::iiwa_link_ee
      translation: [0, 0, 0.01]
      rotation: !Rpy { deg: [-90.0, 0.0, 90.]}

- add_weld:
    parent: iiwa7::wsg_attach
    child: wsg::wsg50_gripper_link

- add_frame:
    name: wsg::finray_attach
    X_PF:
      base_frame: wsg::wsg50_gripper_link
      translation: [0, -0.08, 0.00]
      rotation: !Rpy { deg: [0.0, 0.0, 0.0]}

- add_model:
    name: finray
    file: package://tri_finray_gripper/finray_finger_assembly_box_collision.urdf

- add_weld:
    parent: wsg::finray_attach
    child: finray::base_link

- add_model:
    name: table
    file: package://adaptive_decomp/models/table/table_wide_offset_colgeom.urdf

- add_frame:
    name: table_origin
    X_PF:
      base_frame: world
      translation: [0.9, 0.0, 0.0]
      rotation: !Rpy { deg: [0., 0., 90]}

- add_weld:
    parent: table_origin
    child: table::table_body

- add_frame:
    name: cam_tripod_origin_0
    X_PF:
      base_frame: world
      translation: [0.05, 0.85, 0.0]
      rotation: !Rpy { deg: [0., 0., 00]}

- add_model: #1link #0 joints #8 col geoms
    name: cam_tripod_0
    file: package://adaptive_decomp/camera_box_small.urdf

- add_weld: #1 joint
    parent: cam_tripod_origin_0
    child: cam_tripod_0::camera_box_link

- add_frame: #1link #1joint 
    name: cam_tripod_origin_1
    X_PF:
      base_frame: world
      translation: [0.05, -0.85, 0.0]
      rotation: !Rpy { deg: [0., 0., 00]}

- add_model: #1 link #8 geoms
    name: cam_tripod_1
    file: package://adaptive_decomp/camera_box_small.urdf

- add_weld: #1joint
    parent: cam_tripod_origin_1
    child: cam_tripod_1::camera_box_link

- add_frame: #1link #1joint 
    name: cam_tripod_origin_2
    X_PF:
      base_frame: world
      translation: [0.97, 0.0, 0.0]
      rotation: !Rpy { deg: [0., 0., 00]}

- add_model: 
    name: cam_tripod_2
    file: package://adaptive_decomp/camera_box_big.urdf

- add_weld: 
    parent: cam_tripod_origin_2
    child: cam_tripod_2::camera_box_link

- add_frame:
    name: wall
    X_PF:
      base_frame: world
      translation: [-.4, 0, 0.0]
      rotation: !Rpy { deg: [0., 0., 00]}

- add_model:
    name: box_to_protect_pete
    file: package://adaptive_decomp/box.urdf

- add_weld:
    parent: wall
    child: box_to_protect_pete::box_link   

- add_frame:
    name: ceiling
    X_PF:
      base_frame: world
      translation: [0.4, 0, 0.9]
      rotation: !Rpy { deg: [0., 90., 00]}

- add_model:
    name: stop_going_up_gah
    file: package://adaptive_decomp/box.urdf

- add_weld:
    parent: ceiling
    child: stop_going_up_gah::box_link    